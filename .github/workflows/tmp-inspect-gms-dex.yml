name: Temporary inspect ARM64 GMS DEX

on:
  push:
    branches:
      - vic
    paths:
      - .github/gms-dex-241017-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download ARM64 GMS 24.10.17
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/vic/arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gms.apk "$url"
          ls -lh /tmp/gms.apk
          sha256sum /tmp/gms.apk

      - name: Disassemble NPE path
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apkanalyzer"
          echo "apkanalyzer=$apkanalyzer"
          "$apkanalyzer" --version || true

          dump() {
            local cls="$1"
            local method="${2:-}"
            echo "===== CLASS $cls METHOD $method ====="
            if [ -n "$method" ]; then
              "$apkanalyzer" dex code --class "$cls" --method "$method" /tmp/gms.apk || true
            else
              "$apkanalyzer" dex code --class "$cls" /tmp/gms.apk || true
            fi
          }

          dump bpqh
          dump jly
          dump jlk
          dump jml
          dump com.google.android.gms.chimera.GmsAppComponentFactory

          echo "===== JADX FIND jly.a ASSIGNMENTS ====="
          jadx_url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$jadx_url"
          curl -fL --retry 5 -o /tmp/jadx.zip "$jadx_url"
          rm -rf /tmp/jadx /tmp/jadx-out
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx -j 4 --no-res --show-bad-code -d /tmp/jadx-out /tmp/gms.apk >/tmp/jadx.log 2>&1 || true
          tail -n 30 /tmp/jadx.log
          echo "===== jly.a assignment/reference hits ====="
          grep -R -n -E 'jly\.a[[:space:]]*=|jly\.a;|jly\.a\b' /tmp/jadx-out/sources | head -n 300 || true

