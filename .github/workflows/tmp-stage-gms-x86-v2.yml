name: Temporary stage x86 GMS 24.10.17 v2

on:
  push:
    branches:
      - vic
    paths:
      - .github/gms-x86-stage-v2-trigger

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vic
        uses: actions/checkout@v4
        with:
          ref: vic
          fetch-depth: 0

      - name: Reuse validated APKMirror downloader
        shell: bash
        run: |
          set -euo pipefail
          src=".github/workflows/tmp-inspect-gms-x86.yml"
          test -f "$src"
          rm -rf /tmp/apkm-x86
          mkdir -p /tmp/apkm-x86
          python3 - <<'PY'
          from pathlib import Path
          lines=Path(".github/workflows/tmp-inspect-gms-x86.yml").read_text().splitlines()
          begin=next(i for i,l in enumerate(lines) if "node --input-type=module <<'JS'" in l)
          end=next(i for i in range(begin+1,len(lines)) if lines[i].strip()=="JS")
          body=[]
          for line in lines[begin+1:end]:
              body.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/apkm-x86/download.mjs").write_text("\n".join(body)+"\n")
          PY
          cd /tmp/apkm-x86
          npm init -y >/dev/null 2>&1
          npm install cheerio >/dev/null 2>&1
          node download.mjs
          test -f /tmp/PrebuiltGmsCorePano-x86.apk

      - name: Validate and commit x86 GMS
        shell: bash
        run: |
          set -euo pipefail
          dst="arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          x86="/tmp/PrebuiltGmsCorePano-x86.apk"
          gsf="arm64/proprietary/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk"

          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 2>/dev/null | sort -V | tail -n1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -perm -111 2>/dev/null | sort -V | tail -n1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apkanalyzer"
          test -n "$aapt2"
          test -n "$apksigner"

          echo "=== exact x86 artifact ==="
          echo "44f446fc19a9bbc56d1b0bdbfc4afcd99872656cb828e509532964d1eb80787c  $x86" | sha256sum -c -
          test "$("$aapt2" dump badging "$x86" 2>/dev/null | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)" = "com.google.android.gms"
          test "$("$apkanalyzer" manifest version-code "$x86")" = "241017105"
          test "$("$apkanalyzer" manifest version-name "$x86")" = "24.10.17 (080706-617915183)"
          test "$("$apkanalyzer" manifest target-sdk "$x86")" = "34"
          unzip -Z1 "$x86" | grep -q '^lib/x86/'

          echo "=== signer and GSF lineage ==="
          "$apksigner" verify --verbose --print-certs "$x86" > /tmp/x86.signer 2>&1
          cat /tmp/x86.signer
          grep -q 'certificate SHA-256 digest: f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83' /tmp/x86.signer
          "$apksigner" lineage --in "$gsf" --print-certs -v > /tmp/gsf.lineage
          cat /tmp/gsf.lineage
          grep -A20 'certificate SHA-256 digest: f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83' /tmp/gsf.lineage | \
            grep -q 'Has shared UID capability    : true'

          echo "=== requested permission set must be identical ==="
          "$aapt2" dump permissions "$dst" 2>/dev/null | sed -n "s/.*uses-permission[^:]*: name='\\([^']*\\)'.*/\\1/p" | sort -u > /tmp/arm.perms
          "$aapt2" dump permissions "$x86" 2>/dev/null | sed -n "s/.*uses-permission[^:]*: name='\\([^']*\\)'.*/\\1/p" | sort -u > /tmp/x86.perms
          diff -u /tmp/arm.perms /tmp/x86.perms

          echo "=== critical manifest must match ==="
          "$apkanalyzer" manifest print "$dst" > /tmp/arm.xml
          "$apkanalyzer" manifest print "$x86" > /tmp/x86.xml
          python3 - <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          A="{http://schemas.android.com/apk/res/android}"
          def get(path):
              r=ET.parse(path).getroot()
              app=r.find("application")
              gp=[]
              for e in r.iter("provider"):
                  if e.get(A+"name")=="com.google.android.gms.gservices.provider.GservicesProvider":
                      gp.append({k:e.get(A+k) for k in ("name","authorities","process","exported","directBootAware","enabled")})
              return {
                  "package":r.get("package"),
                  "sharedUserId":r.get(A+"sharedUserId"),
                  "application":{k:app.get(A+k) for k in ("name","appComponentFactory","extractNativeLibs","directBootAware","persistent")},
                  "gservicesProvider":gp,
              }
          a=get("/tmp/arm.xml"); x=get("/tmp/x86.xml")
          print("ARM64",json.dumps(a,sort_keys=True))
          print("X86",json.dumps(x,sort_keys=True))
          if a!=x: sys.exit("critical manifest mismatch")
          if x["sharedUserId"]!="com.google.uid.shared": sys.exit("unexpected sharedUserId")
          PY

          echo "=== move onto latest vic without overwriting concurrent work ==="
          git fetch origin vic
          git merge --ff-only origin/vic
          echo "a2077de7167c993aaea31e7f1d1e121ced74dc06119dfcc04e723195b7b75080  $dst" | sha256sum -c -

          install -m 0644 "$x86" "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dst"
          git diff --cached --stat
          git commit -m "vic: test x86 GMS 24.10.17"
          git push origin HEAD:vic
