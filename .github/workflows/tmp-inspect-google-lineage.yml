name: Temporary inspect Google signing lineage

on:
  push:
    branches:
      - vic
    paths:
      - .github/google-lineage-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vic
          fetch-depth: 1

      - name: Print signing lineages
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apksigner"
          for spec in             GMS:arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk             GSF:arm64/proprietary/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk             SETUPWRAITH:arm64/proprietary/product/priv-app/SetupWraithPrebuilt/SetupWraithPrebuilt.apk; do
            label="${spec%%:*}"
            apk="${spec#*:}"
            echo "=== LINEAGE $label ==="
            "$apksigner" lineage --in "$apk" --print-certs -v || true
          done
