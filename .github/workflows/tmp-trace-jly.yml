name: Temporary trace jly Context initializer

on:
  push:
    branches:
      - vic
    paths:
      - .github/jly-trace-trigger

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Download GMS and apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/gms.apk "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/vic/arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          apktool_url="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' | head -n1)"
          test -n "$apktool_url"
          curl -fL --retry 5 -o /tmp/apktool.jar "$apktool_url"

      - name: Decode smali and locate jly Context writes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gms-smali
          java -jar /tmp/apktool.jar d -f -r -o /tmp/gms-smali /tmp/gms.apk >/tmp/apktool.log 2>&1
          tail -n 20 /tmp/apktool.log

          echo "===== WRITES TO jly.a Context ====="
          hits="$(grep -R -l -F 'Ljly;->a:Landroid/content/Context;' /tmp/gms-smali/smali* || true)"
          printf '%s\n' "$hits"

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "===== FILE $f ====="
            grep -n -F -B40 -A40 'Ljly;->a:Landroid/content/Context;' "$f" || true
          done <<< "$hits"

          gms="/tmp/gms-smali/smali_classes2/com/google/android/gms/common/app/GmsApplication.smali"
          echo "===== attachBaseContext declaration ====="
          grep -n '^\.method.*attachBaseContext' "$gms" || true

          echo "===== method containing jly.a assignment ====="
          awk '
            /^\.method/ {m=$0; n=NR}
            /sput-object .*Ljly;->a:Landroid\/content\/Context;/ {
              print "method_line=" n
              print m
              print "assignment_line=" NR
            }
          ' "$gms"

          echo "===== GmsApplication Context/provider-query landmarks ====="
          grep -n -E 'ContentResolver;->query|Ljly;->a:Landroid/content/Context;|Ljml;->f\(\)Ljml;' "$gms" || true

          echo "===== GmsApplication around jly.a assignment ====="
          sed -n '3820,3945p' "$gms"

          echo "===== vxn class ====="
          vxn="$(find /tmp/gms-smali -type f -name 'vxn.smali' | head -n1)"
          test -n "$vxn"
          cat "$vxn"

          echo "===== all refs/writes to Lvxn fields ====="
          refs="$(grep -R -l -E 'Lvxn;->' /tmp/gms-smali/smali* || true)"
          printf '%s\n' "$refs"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "===== VXN REF FILE $f ====="
            grep -n -E -B25 -A25 'Lvxn;->' "$f" || true
          done <<< "$refs"

          echo "===== attachBaseContext around source line 424 ====="
          awk '
            /^    \.line 400$/ {show=1}
            show {print}
            /^    \.line 460$/ {exit}
          ' "$gms" || true

          echo "===== GmsApplication beginning / vxn construction method ====="
          sed -n '1,240p' "$gms"

          echo "===== refs to GmsApplication.e vxn ====="
          grep -n -F -B30 -A50 'GmsApplication;->e:Lvxn;' "$gms" || true

          echo "===== BaseApplicationContext ====="
          bac="$(find /tmp/gms-smali -type f -path '*/com/google/android/gms/common/app/BaseApplicationContext.smali' | head -n1)"
          test -n "$bac"
          cat "$bac"

          echo "===== GMS manifest gservices provider ====="
          grep -n -B8 -A15 'com.google.android.gsf.gservices' /tmp/gms-smali/AndroidManifest.xml || true

          echo "===== Decode GSF manifest ====="
          curl -fL --retry 5 -o /tmp/gsf.apk "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/vic/arm64/proprietary/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk"
          rm -rf /tmp/gsf-dec
          java -jar /tmp/apktool.jar d -f -s -r -o /tmp/gsf-dec /tmp/gsf.apk >/tmp/gsf-apktool.log 2>&1
          grep -n -B8 -A15 'com.google.android.gsf.gservices' /tmp/gsf-dec/AndroidManifest.xml || true
