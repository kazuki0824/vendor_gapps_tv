name: Temporary cleanup GMS update

on:
  push:
    branches:
      - vic
    paths:
      - .github/gms-update-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vic
        uses: actions/checkout@v4
        with:
          ref: vic
          fetch-depth: 0

      - name: Remove temporary branch and workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git push origin --delete tmp/update-prebuilt-gmscorepano || true

          git rm .github/workflows/tmp-update-gms.yml
          git rm .github/gms-update-trigger

          git commit -m "ci: remove temporary GMS update workflow"
          git push origin HEAD:vic
