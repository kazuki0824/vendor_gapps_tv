name: Temporary stage x86 GMS 24.10.17

on:
  push:
    branches:
      - vic
    paths:
      - .github/gms-x86-stage-trigger

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vic
        uses: actions/checkout@v4
        with:
          ref: vic
          fetch-depth: 0

      - name: Dump ARM64 GMS DEX NPE path
        shell: bash
        run: |
          set -euo pipefail
          arm="arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apkanalyzer"

          echo "=== APkAnalyzer ==="
          "$apkanalyzer" --version || true

          echo "=== TARGET CLASSES IN DEX TREE ==="
          "$apkanalyzer" dex packages --defined-only "$arm" |
            grep -E '(^| )((bpqh|jly|jlk|jml)( |$)|GmsAppComponentFactory)' || true

          for cls in bpqh jly jlk jml com.google.android.gms.chimera.GmsAppComponentFactory; do
            echo "===== DEX CLASS $cls ====="
            "$apkanalyzer" dex code --class "$cls" "$arm" || true
          done

      - name: Download exact Android TV x86 GMS 24.10.17
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apkm-x86
          mkdir -p /tmp/apkm-x86
          cd /tmp/apkm-x86
          npm init -y >/dev/null 2>&1
          npm install cheerio >/dev/null 2>&1

          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { load } from "cheerio";

          const BASE = "https://www.apkmirror.com";
          const variantPath = "/apk/google-inc/google-play-services-android-tv/google-play-services-android-tv-24-10-17-release/google-play-services-android-tv-24-10-17-080706-617915183-android-apk-download/";
          const headers = {
            "user-agent": "APKUpdater-v0",
            "authorization": "Basic YXBpLWFwa3VwZGF0ZXI6cm01cmNmcnVVakt5MDRzTXB5TVBKWFc4"
          };

          async function getText(url) {
            const r = await fetch(url, {headers, redirect: "follow"});
            console.log("GET", url, "=>", r.status, r.url);
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
            return await r.text();
          }

          const variantHtml = await getText(BASE + variantPath);
          let $ = load(variantHtml);
          const jump = $("a.downloadButton").attr("href");
          if (!jump) throw new Error("Could not find APKMirror downloadButton");

          const jumpHtml = await getText(new URL(jump, BASE).href);
          $ = load(jumpHtml);
          const direct = $(".card-with-tabs a[href]").attr("href");
          if (!direct) throw new Error("Could not find APKMirror final download link");

          const finalUrl = new URL(direct, BASE).href;
          const res = await fetch(finalUrl, {headers, redirect: "follow"});
          console.log("FINAL", res.status, res.url);
          console.log("content-type", res.headers.get("content-type"));
          console.log("content-length", res.headers.get("content-length"));
          if (!res.ok) throw new Error("Final download HTTP " + res.status);

          const buf = Buffer.from(await res.arrayBuffer());
          console.log("downloaded_bytes=" + buf.length);
          console.log("magic=" + buf.subarray(0,8).toString("hex"));
          if (buf.length < 1024 * 1024 || buf[0] !== 0x50 || buf[1] !== 0x4b) {
            throw new Error("download is not an APK/ZIP");
          }
          fs.writeFileSync("/tmp/PrebuiltGmsCorePano-x86.apk", buf);
          JS

      - name: Compare metadata, signatures, manifests, permissions, and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          arm="arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          x86="/tmp/PrebuiltGmsCorePano-x86.apk"
          gsf="arm64/proprietary/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk"
          suw="arm64/proprietary/product/priv-app/SetupWraithPrebuilt/SetupWraithPrebuilt.apk"

          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 2>/dev/null | sort -V | tail -n1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -perm -111 2>/dev/null | sort -V | tail -n1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apkanalyzer"
          test -n "$aapt2"
          test -n "$apksigner"

          meta() {
            local label="$1" apk="$2"
            echo "=== META $label ==="
            echo "package=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
            echo "versionCode=$("$apkanalyzer" manifest version-code "$apk")"
            echo "versionName=$("$apkanalyzer" manifest version-name "$apk")"
            echo "minSdk=$("$apkanalyzer" manifest min-sdk "$apk")"
            echo "targetSdk=$("$apkanalyzer" manifest target-sdk "$apk")"
            sha256sum "$apk"
            echo "native_abis:"
            unzip -Z1 "$apk" | sed -n 's#^lib/\\([^/]*\\)/.*#\\1#p' | sort -u
          }

          meta ARM64 "$arm"
          meta X86 "$x86"

          test "$("$aapt2" dump badging "$x86" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)" = "com.google.android.gms"
          test "$("$apkanalyzer" manifest version-code "$x86")" = "241017105"
          case "$("$apkanalyzer" manifest version-name "$x86")" in
            "24.10.17"*) ;;
            *) echo "Unexpected x86 versionName" >&2; exit 1 ;;
          esac
          test "$("$apkanalyzer" manifest target-sdk "$x86")" = "34"
          unzip -Z1 "$x86" | grep -q '^lib/x86/'

          for item in ARM64:"$arm" X86:"$x86" GSF:"$gsf" SETUPWRAITH:"$suw"; do
            label="${item%%:*}"
            apk="${item#*:}"
            echo "=== SIGNER $label ==="
            "$apksigner" verify --verbose --print-certs "$apk"
          done

          echo "=== REQUESTED PERMISSIONS ARM64 ==="
          "$aapt2" dump permissions "$arm" | sed -n "s/.*uses-permission[^:]*: name='\\([^']*\\)'.*/\\1/p" | sort -u | tee /tmp/arm.perms
          echo "=== REQUESTED PERMISSIONS X86 ==="
          "$aapt2" dump permissions "$x86" | sed -n "s/.*uses-permission[^:]*: name='\\([^']*\\)'.*/\\1/p" | sort -u | tee /tmp/x86.perms
          echo "=== X86-ONLY REQUESTED PERMISSIONS ==="
          comm -13 /tmp/arm.perms /tmp/x86.perms | tee /tmp/x86-only.perms
          echo "=== ARM64-ONLY REQUESTED PERMISSIONS ==="
          comm -23 /tmp/arm.perms /tmp/x86.perms | tee /tmp/arm-only.perms

          "$apkanalyzer" manifest print "$arm" > /tmp/arm.manifest.xml
          "$apkanalyzer" manifest print "$x86" > /tmp/x86.manifest.xml
          echo "=== MANIFEST DIFF (first 500 lines) ==="
          diff -u /tmp/arm.manifest.xml /tmp/x86.manifest.xml | head -n 500 || true

          echo "=== SIGNER SHA256 SETS ==="
          for spec in arm:"$arm" x86:"$x86" gsf:"$gsf" suw:"$suw"; do
            label="${spec%%:*}"
            apk="${spec#*:}"
            "$apksigner" verify --verbose --print-certs "$apk" 2>&1 |
              sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: //p' |
              sort -u > "/tmp/$label.certs"
            echo "$label:"; cat "/tmp/$label.certs"
          done

          echo "=== X86 signer overlap with GSF ==="
          comm -12 /tmp/x86.certs /tmp/gsf.certs | tee /tmp/x86-gsf-overlap
          test -s /tmp/x86.certs
          test -s /tmp/gsf.certs
          # Direct current-signer overlap is not required: GSF/GMS carry a signing lineage.

          echo "=== X86 extra permission count ==="
          wc -l /tmp/x86-only.perms

      - name: Validate compatibility and stage x86 GMS
        shell: bash
        run: |
          set -euo pipefail
          dst="arm64/proprietary/product/priv-app/PrebuiltGmsCorePano/PrebuiltGmsCorePano.apk"
          x86="/tmp/PrebuiltGmsCorePano-x86.apk"
          gsf="arm64/proprietary/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk"

          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 2>/dev/null | sort -V | tail -n1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -perm -111 2>/dev/null | sort -V | tail -n1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -n1)"
          test -n "$apkanalyzer"
          test -n "$aapt2"
          test -n "$apksigner"

          echo "=== exact artifact guards ==="
          echo "44f446fc19a9bbc56d1b0bdbfc4afcd99872656cb828e509532964d1eb80787c  $x86" | sha256sum -c -
          test "$("$aapt2" dump badging "$x86" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)" = "com.google.android.gms"
          test "$("$apkanalyzer" manifest version-code "$x86")" = "241017105"
          case "$("$apkanalyzer" manifest version-name "$x86")" in
            "24.10.17 (080706-617915183)") ;;
            *) echo "Unexpected versionName" >&2; exit 1 ;;
          esac
          test "$("$apkanalyzer" manifest target-sdk "$x86")" = "34"
          unzip -Z1 "$x86" | grep -q '^lib/x86/'

          echo "=== signer guard ==="
          "$apksigner" verify --verbose --print-certs "$x86" > /tmp/x86.signer 2>&1
          cat /tmp/x86.signer
          grep -q 'certificate SHA-256 digest: f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83' /tmp/x86.signer

          echo "=== GSF signing-lineage shared-UID guard ==="
          "$apksigner" lineage --in "$gsf" --print-certs -v > /tmp/gsf.lineage 2>&1
          cat /tmp/gsf.lineage
          python3 - <<'PY'
          import re, sys
          s=open("/tmp/gsf.lineage").read()
          target="f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83"
          blocks=re.split(r"(?=Signer #[0-9]+ in lineage)", s)
          match=[b for b in blocks if target in b]
          if len(match) != 1 or "Has shared UID capability    : true" not in match[0]:
              print("legacy signer is not authorized for shared UID", file=sys.stderr)
              sys.exit(1)
          PY

          echo "=== requested-permission identity guard ==="
          "$aapt2" dump permissions "$dst" 2>/dev/null | sed -n "s/.*uses-permission[^:]*: name='\([^']*\)'.*/\1/p" | sort -u > /tmp/arm.perms
          "$aapt2" dump permissions "$x86" 2>/dev/null | sed -n "s/.*uses-permission[^:]*: name='\([^']*\)'.*/\1/p" | sort -u > /tmp/x86.perms
          diff -u /tmp/arm.perms /tmp/x86.perms

          echo "=== critical-manifest guard ==="
          "$apkanalyzer" manifest print "$dst" > /tmp/arm.xml
          "$apkanalyzer" manifest print "$x86" > /tmp/x86.xml
          python3 - <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          A="{http://schemas.android.com/apk/res/android}"
          def critical(path):
              root=ET.parse(path).getroot()
              app=root.find("application")
              gp=[]
              for e in root.iter("provider"):
                  if e.get(A+"name")=="com.google.android.gms.gservices.provider.GservicesProvider":
                      gp.append({k:e.get(A+k) for k in ("name","authorities","process","exported","directBootAware","enabled")})
              return {
                  "package": root.get("package"),
                  "sharedUserId": root.get(A+"sharedUserId"),
                  "application": {k:app.get(A+k) for k in ("name","appComponentFactory","extractNativeLibs","directBootAware","persistent")},
                  "gservicesProvider": gp,
              }
          arm=critical("/tmp/arm.xml")
          x86=critical("/tmp/x86.xml")
          print("ARM64 critical:", json.dumps(arm,sort_keys=True))
          print("X86 critical:", json.dumps(x86,sort_keys=True))
          if arm != x86:
              print("critical manifest mismatch", file=sys.stderr)
              sys.exit(1)
          if x86["sharedUserId"] != "com.google.uid.shared":
              print("unexpected sharedUserId", file=sys.stderr)
              sys.exit(1)
          PY

          echo "=== replace only GMSCore APK ==="
          install -m 0644 "$x86" "$dst"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dst"
          git diff --cached --stat
          git commit -m "vic: test x86 GMS 24.10.17"
          git push origin HEAD:vic
